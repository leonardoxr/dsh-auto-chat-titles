name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify generated artifacts are committed
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=all -- lib client)"
      - name: Verify package contents
        shell: bash
        run: npm pack --dry-run

  packed-import:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm pack
      - name: Smoke import packed host plugin
        run: |
          mkdir smoke && cd smoke
          npm init -y
          npm install --ignore-scripts ../dsh-auto-chat-titles-*.tgz
          node -e "import('dsh-auto-chat-titles').then(m => { if (typeof m.apply !== 'function') process.exit(1) })"
